[project]
name = "vietnamese-word-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HP VICTUS", email = "24021384@vnu.edu.vn" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
